name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: checker and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Type-check implementation and tests
        shell: bash
        run: |
          set +e
          basedpyright --level warning --warnings src tests 2>&1 | tee basedpyright.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload BasedPyright failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: basedpyright-log
          path: basedpyright.log

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify clean fixture
        run: strictpy check fixtures/clean > clean-report.json

      - name: Verify broken fixture
        shell: bash
        run: |
          set +e
          strictpy check fixtures/broken > broken-report.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("broken-report.json").read_text())
          codes = {item["code"] for item in report["diagnostics"]}
          required = {
              "strictpy::missing_parameter_type",
              "strictpy::no_any",
              "strictpy::no_assert",
              "strictpy::no_try",
              "strictpy::no_raise",
          }
          missing = required - codes
          if missing:
              raise SystemExit(f"missing diagnostics: {sorted(missing)}")
          if not any(code.startswith("basedpyright::") for code in codes):
              raise SystemExit("missing BasedPyright diagnostic")
          PY

  generated:
    name: capture generated uv lock
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install strictpy and uv
        run: |
          python -m pip install .
          python -m pip install uv==0.11.29

      - name: Generate and resolve project
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          strictpy new hello-strictpy > report.json
          grep -q '"ok": true' report.json
          cd hello-strictpy
          uv lock
          cp uv.lock "$GITHUB_WORKSPACE/generated-uv.lock"

      - name: Upload generated uv lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-uv-lock
          path: generated-uv.lock

      - name: Stop after lock capture
        run: exit 1
