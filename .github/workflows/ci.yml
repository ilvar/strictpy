name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Type-check implementation and tests
        shell: bash
        run: |
          set -o pipefail
          basedpyright --level warning --warnings src tests 2>&1 | tee basedpyright.log

      - name: Upload BasedPyright failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: basedpyright-log
          path: basedpyright.log

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify clean fixture
        run: strictpy check fixtures/clean > clean-report.json

      - name: Verify broken fixture
        shell: bash
        run: |
          set +e
          strictpy check fixtures/broken > broken-report.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("broken-report.json").read_text())
          codes = {item["code"] for item in report["diagnostics"]}
          required = {
              "strictpy::missing_parameter_type",
              "strictpy::no_any",
              "strictpy::no_assert",
              "strictpy::no_try",
              "strictpy::no_raise",
          }
          missing = required - codes
          if missing:
              raise SystemExit(f"missing diagnostics: {sorted(missing)}")
          if not any(code.startswith("basedpyright::") for code in codes):
              raise SystemExit("missing BasedPyright diagnostic")
          PY
